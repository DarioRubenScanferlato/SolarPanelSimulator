version: '3.8'

# Production orchestration — requires .env.prod with:
#   DOMAIN=solar.yourdomain.com
#   ALLOWED_ORIGINS=https://solar.yourdomain.com
#   RATE_LIMIT_PER_MINUTE=30

services:
  backend:
    build: ./backend
    container_name: solar-backend-prod
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: always
    networks:
      - solar-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend:
    build: ./frontend
    container_name: solar-frontend-prod
    expose:
      - "3000"
    environment:
      - API_URL=https://${DOMAIN}/api
    restart: always
    networks:
      - solar-prod-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  nginx:
    image: nginx:1.25-alpine
    container_name: solar-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always
    networks:
      - solar-prod-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

volumes:
  nginx-logs:

networks:
  solar-prod-network:
    driver: bridge

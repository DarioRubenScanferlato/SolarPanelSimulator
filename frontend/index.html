<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Panel Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☀️ Solar Panel Simulator</h1>
            <p>Calculate your solar energy production</p>
        </header>

        <main>
            <!-- Input Form -->
            <section class="form-section">
                <h2>System Parameters</h2>
                <form id="simulatorForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="latitude">Latitude (°)</label>
                            <input type="number" id="latitude" name="latitude" min="-90" max="90" step="any" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="longitude">Longitude (°)</label>
                            <input type="number" id="longitude" name="longitude" min="-180" max="180" step="any" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="panelCount">Panel Count</label>
                            <input type="number" id="panelCount" name="panelCount" min="1" step="1" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="panelArea">Panel Area (m²)</label>
                            <input type="number" id="panelArea" name="panelArea" min="0.1" step="0.1" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="efficiency">Efficiency (%)</label>
                            <input type="number" id="efficiency" name="efficiency" min="5" max="25" step="0.1" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="tiltAngle">Tilt Angle (°)</label>
                            <input type="number" id="tiltAngle" name="tiltAngle" min="0" max="90" step="0.1" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="azimuth">Azimuth (°)</label>
                            <input type="number" id="azimuth" name="azimuth" min="0" max="360" step="0.1" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="startDate">Start Date</label>
                            <input type="date" id="startDate" name="startDate" required>
                            <span class="error"></span>
                        </div>

                        <div class="form-group">
                            <label for="duration">Duration (days)</label>
                            <input type="number" id="duration" name="duration" min="1" step="1" required>
                            <span class="error"></span>
                        </div>
                    </div>

                    <button type="submit" id="simulateBtn" class="btn-primary">Simulate</button>
                    <div id="formError" class="alert alert-error" style="display: none;"></div>
                </form>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>Results</h2>

                <!-- Summary Cards -->
                <div class="cards-grid">
                    <div class="card">
                        <div class="card-value" id="annualEnergy">-</div>
                        <div class="card-label">Annual Energy (kWh)</div>
                    </div>
                    <div class="card">
                        <div class="card-value" id="dailyAverage">-</div>
                        <div class="card-label">Daily Average (kWh)</div>
                    </div>
                    <div class="card">
                        <div class="card-value" id="peakHour">-</div>
                        <div class="card-label">Peak Hour (kW)</div>
                    </div>
                    <div class="card">
                        <div class="card-value" id="capacity">-</div>
                        <div class="card-label">System Capacity (kW)</div>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts-container">
                    <div class="chart-box">
                        <h3>Daily Generation Profile</h3>
                        <div class="chart-wrapper">
                            <canvas id="dailyChart"></canvas>
                        </div>
                        <p class="chart-info" id="dailyInfo">-</p>
                    </div>

                    <div class="chart-box">
                        <h3>Yearly Energy Production</h3>
                        <div class="chart-wrapper">
                            <canvas id="yearlyChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Loading indicator -->
            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Simulating...</p>
            </div>
        </main>

        <footer>
            <p>Backend: <code>http://localhost:8000</code></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>

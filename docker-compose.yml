version: '3.8'

services:
  backend:
    build: ./backend
    container_name: solar-simulator-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: solar-simulator-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
